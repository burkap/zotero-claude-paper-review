name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pymupdf pyyaml
      - name: Tests
        working-directory: plugin
        run: |
          npm i --no-save jsdom@24
          node test/mock-test.js
          node test/profile-test.js
          node test/queue-test.js
      - name: The tag must match manifest.json
        run: |
          v=$(python3 -c "import json;print(json.load(open('plugin/manifest.json'))['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != manifest version $v"; exit 1; }
      - run: ./scripts/build.sh
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
